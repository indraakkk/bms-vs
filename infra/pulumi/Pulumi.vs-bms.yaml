config:
  gcp:project: vs-bms
  gcp:region: us-central1
  # billingbudgets (and other user-cred APIs) need an explicit quota
  # project when running on plain gcloud user credentials.
  gcp:billingProject: vs-bms
  gcp:userProjectOverride: "true"
  # billingAccount is not stored here — set it locally as a secret so the
  # account ID never lands in the repo:
  #   pulumi config set --secret bms-infra:billingAccount <ACCOUNT_ID>
  bms-infra:githubRepo: indraakkk/bms-vs
