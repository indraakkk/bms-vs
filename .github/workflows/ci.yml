# PR checks: lint, typecheck, unit tests, build — all DB-free by design
# (tests stub Prisma; build never touches the database).
# Turborepo remote cache (self-hosted on Cloud Run, GCS-backed) is wired
# via env vars; if TURBO_API/TURBO_TOKEN are unset or the cache server is
# down, turbo silently falls back to uncached runs — CI never hard-depends
# on it.
name: CI

on:
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TURBO_API: ${{ vars.TURBO_API }}
      TURBO_TEAM: bms
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13 # keep in sync with root package.json packageManager

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: bunx turbo run lint typecheck test build
